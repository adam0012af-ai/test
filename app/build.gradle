plugins {
    id 'com.android.application'
}

def envOrEmpty = { String key ->
    def value = System.getenv(key)
    return value == null ? '' : value.replace('\\', '\\\\').replace('"', '\\"')
}

android {
    namespace 'com.adam.downloadhub'
    compileSdk 35

    defaultConfig {
        applicationId 'com.adam.downloadhub'
        minSdk 29
        targetSdk 35
        versionCode 67
        versionName '6.1.2-editor-actions-test'

        ndk {
            abiFilters 'arm64-v8a'
        }

        buildConfigField 'boolean', 'SEARCH_ENABLED', 'false'
        buildConfigField 'boolean', 'YTDLP_ENABLED', 'false'

        buildConfigField 'String', 'YOUTUBE_CLIENT_ID', '"' + envOrEmpty('YOUTUBE_CLIENT_ID') + '"'
        buildConfigField 'String', 'TIKTOK_CLIENT_KEY', '"' + envOrEmpty('TIKTOK_CLIENT_KEY') + '"'
        buildConfigField 'String', 'META_APP_ID', '"' + envOrEmpty('META_APP_ID') + '"'
        buildConfigField 'String', 'PUBLISH_BACKEND_BASE_URL', '"' + envOrEmpty('PUBLISH_BACKEND_BASE_URL') + '"'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packaging {
        jniLibs {
            excludes += ['**/libpython.so', '**/libpython.zip.so', '**/libqjs.so']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
}
