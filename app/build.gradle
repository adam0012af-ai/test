plugins {
    id 'com.android.application'
}

def envOrEmpty = { String key ->
    def value = System.getenv(key)
    return value == null ? '' : value.replace('\\', '\\\\').replace('"', '\\"')
}

android {
    namespace 'com.adam.downloadhub'
    compileSdk 35

    defaultConfig {
        applicationId 'com.adam.downloadhub'
        minSdk 29
        targetSdk 35
        versionCode 60
        versionName '6.0.0'

        // Public identifiers can be injected at build time. Secrets/tokens are never stored in the APK.
        buildConfigField 'String', 'YOUTUBE_CLIENT_ID', '"' + envOrEmpty('YOUTUBE_CLIENT_ID') + '"'
        buildConfigField 'String', 'TIKTOK_CLIENT_KEY', '"' + envOrEmpty('TIKTOK_CLIENT_KEY') + '"'
        buildConfigField 'String', 'META_APP_ID', '"' + envOrEmpty('META_APP_ID') + '"'
        buildConfigField 'String', 'PUBLISH_BACKEND_BASE_URL', '"' + envOrEmpty('PUBLISH_BACKEND_BASE_URL') + '"'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// youtubedl-android pulls old jdk7/jdk8 compatibility artifacts alongside Kotlin 1.8.
// Kotlin 1.8 already contains those APIs, so excluding the legacy wrappers avoids duplicate classes.
configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
}
